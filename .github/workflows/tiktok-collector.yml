name: Coletar perfis TikTok
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'collector/**'
      - 'collector-bridge.ts'
      - '.github/workflows/tiktok-collector.yml'
permissions:
  contents: read
  id-token: write
concurrency:
  group: radar-browser-collector
  cancel-in-progress: false
jobs:
  collect:
    if: github.repository == 'jose-sites/radar-da-tropa' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Testar validação e alternativas
        run: python -m unittest discover -s collector -p 'test_*.py'
      - name: Reservar até três consultas
        id: queue
        run: python collector/run.py --claim --jobs "$RUNNER_TEMP/radar-collector-jobs.json"
      - name: Instalar bibliotecas fixadas
        if: steps.queue.outputs.has_jobs == 'true'
        run: pip install -r collector/requirements.txt
      - name: Instalar navegador
        if: steps.queue.outputs.has_jobs == 'true'
        run: python -m playwright install --with-deps chromium
      - name: Consultar e salvar somente identidades válidas
        if: steps.queue.outputs.has_jobs == 'true'
        run: python collector/run.py --jobs "$RUNNER_TEMP/radar-collector-jobs.json"
