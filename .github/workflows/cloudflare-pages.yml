name: Publicar Radar no Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radar-cloudflare-production
  cancel-in-progress: false

jobs:
  connection:
    name: Verificar conexão Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ready: ${{ steps.credentials.outputs.ready }}
    steps:
      - name: Conferir segredos sem mostrar valores
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Conexão configurada. A publicação verificará o projeto existente." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "### Falta autorizar o Cloudflare uma vez" >> "$GITHUB_STEP_SUMMARY"
            echo "Adicione CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID em Settings → Secrets and variables → Actions." >> "$GITHUB_STEP_SUMMARY"
            echo "Nenhum arquivo foi publicado e nenhum projeto foi criado." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    name: Atualizar radardatropa.pages.dev
    needs: connection
    if: needs.connection.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Obter código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Preparar Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Testar código antes de publicar
        run: node --test tests/*.test.mjs
      - name: Confirmar projeto existente e branch de produção
        run: node scripts/cloudflare-project.mjs
      - name: Separar somente os arquivos públicos
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/radar-pages"
          cp index.html _redirects og.png story-approved-v1.webp "$RUNNER_TEMP/radar-pages/"
      - name: Publicar no projeto existente
        shell: bash
        run: |
          npx --yes wrangler@4.151.3 pages deploy "$RUNNER_TEMP/radar-pages" \
            --project-name="$CLOUDFLARE_PAGES_PROJECT" \
            --branch="$CLOUDFLARE_PRODUCTION_BRANCH" \
            --commit-hash="$GITHUB_SHA" \
            --commit-dirty=false
      - name: Conferir versão no endereço público
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import {readFile} from 'node:fs/promises';
          import {setTimeout} from 'node:timers/promises';
          const expected=await readFile('index.html','utf8');
          const expectedTemplate=await readFile('story-approved-v1.webp');
          let confirmed=false;
          for(let attempt=0;attempt<12;attempt++) {
            try {
              const response=await fetch('https://radardatropa.pages.dev/?release='+process.env.GITHUB_SHA,{signal:AbortSignal.timeout(15000),headers:{'Cache-Control':'no-cache'}});
              if(response.ok && await response.text()===expected) {
                const asset=await fetch('https://radardatropa.pages.dev/story-approved-v1.webp?release='+process.env.GITHUB_SHA,{signal:AbortSignal.timeout(15000),headers:{'Cache-Control':'no-cache'}});
                if(asset.ok && Buffer.from(await asset.arrayBuffer()).equals(expectedTemplate)){confirmed=true;break;}
              }
            } catch { /* Allow time for the deployment to propagate. */ }
            await setTimeout(10000);
          }
          if(!confirmed) throw new Error('O envio terminou, mas a versão pública ainda não corresponde ao commit. Confira a implantação no Cloudflare.');
          console.log('Versão pública confirmada em radardatropa.pages.dev.');
          JS
      - name: Registrar publicação
        shell: bash
        run: echo "Publicado em https://radardatropa.pages.dev/ a partir de $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
